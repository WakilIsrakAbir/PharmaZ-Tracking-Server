$kind: http-request
method: PATCH
url: '{{baseUrl}}/doctors/{{doctorId}}/status'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "ongoing",
      "note": "This should not be saved."
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("404, so someone else's form can't be changed", () => pm.response.to.have.status(404));
      pm.test('NOT_FOUND', () => pm.expect(pm.response.json().error.code).to.eql('NOT_FOUND'));
