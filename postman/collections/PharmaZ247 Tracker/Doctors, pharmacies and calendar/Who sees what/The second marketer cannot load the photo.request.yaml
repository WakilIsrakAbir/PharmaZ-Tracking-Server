$kind: http-request
method: GET
url: '{{photoFullUrl}}'
order: 6000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // The photo of the field marketer's second doctor (set by "Load the uploaded photo").
      pm.test('404, because photos are as private as their forms', () => pm.response.to.have.status(404));
      pm.test('NOT_FOUND', () => pm.expect(pm.response.json().error.code).to.eql('NOT_FOUND'));
