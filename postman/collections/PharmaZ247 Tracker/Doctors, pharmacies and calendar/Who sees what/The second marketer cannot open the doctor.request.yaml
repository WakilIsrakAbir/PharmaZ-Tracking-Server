$kind: http-request
method: GET
url: '{{baseUrl}}/doctors/{{doctorId}}'
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("404, as if someone else's form didn't exist", () => pm.response.to.have.status(404));
      pm.test('NOT_FOUND', () => pm.expect(pm.response.json().error.code).to.eql('NOT_FOUND'));
