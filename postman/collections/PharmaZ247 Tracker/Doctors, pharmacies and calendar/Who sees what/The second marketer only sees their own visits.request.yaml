$kind: http-request
method: GET
url: '{{baseUrl}}/calendar?from={{calendarFrom}}&to={{calendarTo}}'
order: 7000
queryParams:
  - key: from
    value: '{{calendarFrom}}'
  - key: to
    value: '{{calendarTo}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const ids = (pm.response.json().data || []).map((item) => item.id);
      pm.test("leaves out the field marketer's doctor and pharmacy", () => {
        pm.expect(ids).to.not.include(pm.collectionVariables.get('doctorId'));
        pm.expect(ids).to.not.include(pm.collectionVariables.get('pharmacyId'));
      });
      pm.test('is empty for someone who has submitted nothing', () => pm.expect(ids).to.eql([]));
