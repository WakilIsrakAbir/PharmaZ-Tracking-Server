$kind: http-request
method: POST
url: '{{baseUrl}}/auth/login'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{otherUserEmail}}",
      "password": "{{otherUserTempPassword}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('signed in as the second marketer', () => {
        pm.expect((pm.response.json().data || {}).id).to.eql(pm.collectionVariables.get('otherUserId'));
      });
