$kind: http-request
method: PATCH
url: '{{baseUrl}}/doctors/{{doctorId}}/status'
order: 13500
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "implementation",
      "visitDate": "2019-07-27T04:00:00.000Z"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 Bad Request', () => pm.response.to.have.status(400));
      const error = pm.response.json().error || {};
      pm.test("a visit can't be moved to a past day", () => {
        pm.expect(error.code).to.eql('VALIDATION_ERROR');
        pm.expect(error.fields && error.fields.visitDate).to.be.a('string');
      });
