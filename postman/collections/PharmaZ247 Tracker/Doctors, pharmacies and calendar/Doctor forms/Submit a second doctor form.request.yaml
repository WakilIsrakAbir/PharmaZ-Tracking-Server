$kind: http-request
method: POST
url: '{{baseUrl}}/doctors'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: '{{doctor2Data}}'
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // A second doctor, visited in three days at 08:00 UTC (2:00 PM in Dhaka), with only the required fields.
      const visit = new Date();
      visit.setUTCDate(visit.getUTCDate() + 3);
      visit.setUTCHours(8, 0, 0, 0);
      pm.collectionVariables.set('doctor2Data', JSON.stringify({
        name: 'Dr. Nusrat Jahan (Gynaecology)',
        phone: '01812-345678',
        address: 'House 5, Road 2, Dhanmondi, Dhaka',
        chamberName: 'Popular Diagnostic Centre',
        consultationTypes: ['in_person', 'teleconsultation'],
        visitDate: visit.toISOString(),
      }));
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('201 Created', () => pm.response.to.have.status(201));
      const doctor = pm.response.json().data || {};
      pm.test('reads the fields that were sent', () => {
        pm.expect(doctor.name).to.eql('Dr. Nusrat Jahan (Gynaecology)');
        pm.expect(doctor.phone).to.eql('+8801812345678');
        pm.expect(doctor.consultationTypes).to.have.members(['in_person', 'teleconsultation']);
      });
      pm.test('fills the fields that were left out with empty values', () => {
        pm.expect(doctor.bmdcRegNo).to.eql('');
        pm.expect(doctor.email).to.eql('');
        pm.expect(doctor.availableDays).to.eql([]);
        pm.expect(doctor.slotDuration).to.eql(null);
        pm.expect(doctor.fees).to.eql({ firstVisit: null, reportView: null, secondVisit: null, afterOneMonth: null });
      });
      if (doctor.id) pm.collectionVariables.set('doctor2Id', doctor.id);
