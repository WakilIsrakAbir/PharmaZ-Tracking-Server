$kind: http-request
method: GET
url: '{{photoFullUrl}}'
order: 4000
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // photoUrl is a path on the API's own address (/api/v1/uploads/...).
      const photoUrl = pm.collectionVariables.get('photoUrl') || '';
      const origin = (String(pm.variables.get('baseUrl')).match(/^https?:\/\/[^/]+/) || [''])[0];
      pm.collectionVariables.set('photoFullUrl', /^https?:\/\//.test(photoUrl) ? photoUrl : origin + photoUrl);
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('is an image', () => {
        pm.expect(pm.response.headers.get('Content-Type') || '').to.match(/^image\//);
      });
      pm.test('has content', () => pm.expect(pm.response.responseSize).to.be.above(0));
