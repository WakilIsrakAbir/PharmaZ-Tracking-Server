$kind: http-request
method: GET
url: '{{baseUrl}}/doctors?status=setup'
order: 10000
queryParams:
  - key: status
    value: setup
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const { data = [], meta = {} } = pm.response.json();
      pm.test('only doctors in Setup', () => {
        pm.expect(data.map((doctor) => doctor.id)).to.not.include(pm.collectionVariables.get('doctorId'));
        data.forEach((doctor) => pm.expect(doctor.status).to.eql('setup'));
      });
      pm.test('the counts ignore the status filter', () => {
        pm.expect(meta.counts.all).to.be.at.least(2);
        pm.expect(meta.counts.demo).to.be.at.least(2);
      });
      pm.test('the page total is the count of that status', () => {
        pm.expect(meta.total).to.eql(meta.counts.setup);
        pm.expect(meta.page).to.eql(1);
        pm.expect(meta.limit).to.eql(20);
        pm.expect(meta.pages).to.eql(Math.ceil(meta.total / 20));
      });
