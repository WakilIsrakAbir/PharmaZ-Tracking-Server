$kind: http-request
method: DELETE
url: '{{baseUrl}}/doctors/{{doctorId}}'
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('403 for a marketer', () => pm.response.to.have.status(403));
      pm.test('FORBIDDEN', () => pm.expect(pm.response.json().error.code).to.eql('FORBIDDEN'));
