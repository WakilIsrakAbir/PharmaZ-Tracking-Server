$kind: http-request
method: PATCH
url: '{{baseUrl}}/auth/password'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "{{fieldUserTempPassword}}",
      "newPassword": "{{fieldUserPassword}}"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.collectionVariables.set('fieldUserPassword', 'Field-Visit-2026');
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('no longer asks for a new password', () => {
        pm.expect((pm.response.json().data || {}).mustChangePassword).to.eql(false);
      });
      pm.test('keeps a working session', () => pm.expect(pm.cookies.has('pz_session')).to.be.true);
