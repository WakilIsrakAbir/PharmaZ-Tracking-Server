$kind: http-request
method: POST
url: '{{baseUrl}}/auth/login'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{adminEmail}}",
      "password": "{{adminPassword}}"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      if (!pm.variables.get('adminEmail') || !pm.variables.get('adminPassword')) {
        throw new Error('Pass the admin account at run time: --env-var "adminEmail=..." --env-var "adminPassword=..."');
      }
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('signed in as the admin', () => {
        const data = pm.response.json().data || {};
        pm.expect(data.role).to.eql('admin');
        pm.expect(data.id).to.eql(pm.collectionVariables.get('adminId'));
      });
      pm.test('sets the session cookie', () => pm.expect(pm.cookies.has('pz_session')).to.be.true);
