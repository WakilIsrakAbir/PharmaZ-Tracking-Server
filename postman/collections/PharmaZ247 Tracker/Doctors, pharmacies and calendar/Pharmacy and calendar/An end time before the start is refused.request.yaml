$kind: http-request
method: PATCH
url: '{{baseUrl}}/pharmacies/{{pharmacyId}}/status'
order: 6200
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "ongoing",
      "visitDate": "{{pharmacyNextVisitDate}}",
      "visitEndDate": "{{earlyEndDate}}"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // Half an hour before the visit starts.
      const start = Date.parse(pm.collectionVariables.get('pharmacyNextVisitDate'));
      pm.collectionVariables.set('earlyEndDate', new Date(start - 30 * 60 * 1000).toISOString());
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 Bad Request', () => pm.response.to.have.status(400));
      const error = pm.response.json().error || {};
      pm.test('the end time must be later than the start', () => {
        pm.expect(error.code).to.eql('VALIDATION_ERROR');
        pm.expect(error.fields && error.fields.visitEndDate).to.be.a('string');
      });
