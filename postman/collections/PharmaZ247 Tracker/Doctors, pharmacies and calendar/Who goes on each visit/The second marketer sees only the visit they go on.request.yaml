$kind: http-request
method: GET
url: '{{baseUrl}}/calendar?from={{teamFrom}}&to={{teamTo}}'
order: 3100
queryParams:
  - key: from
    value: '{{teamFrom}}'
  - key: to
    value: '{{teamTo}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const visits = (pm.response.json().data || []).filter((item) => item.id === pm.collectionVariables.get('teamPharmacyId'));
      pm.test('only the implementation visit, not the setup visit the partner goes on', () => {
        pm.expect(visits.map((visit) => visit.visitDate)).to.eql([pm.collectionVariables.get('teamSecondDate')]);
      });
      pm.test('it says who goes', () => {
        pm.expect(visits[0].assignedTo).to.eql([{ id: pm.collectionVariables.get('otherUserId'), name: 'Second QA Marketer' }]);
      });
