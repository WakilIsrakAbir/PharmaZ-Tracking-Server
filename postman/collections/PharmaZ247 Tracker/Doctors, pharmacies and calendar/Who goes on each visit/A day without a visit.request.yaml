$kind: http-request
method: PUT
url: '{{baseUrl}}/pharmacies/{{teamPharmacyId}}/visits/2001-01-01/assignees'
order: 2400
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "assignees": [{ "email": "{{otherUserEmail}}" }]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('404 Not Found', () => pm.response.to.have.status(404));
      pm.test('says there is no visit that day', () => pm.expect(pm.response.json().error.message).to.include('no visit on that day'));
