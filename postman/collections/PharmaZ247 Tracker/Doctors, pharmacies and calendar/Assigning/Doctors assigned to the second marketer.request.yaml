$kind: http-request
method: GET
url: '{{baseUrl}}/doctors?assignee={{otherUserId}}'
order: 3200
queryParams:
  - key: assignee
    value: '{{otherUserId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const { data = [], meta = {} } = pm.response.json();
      pm.test('lists the doctor the second marketer was just assigned to, and only that one', () => {
        pm.expect(data.map((doctor) => doctor.id)).to.eql([pm.collectionVariables.get('doctorId')]);
        pm.expect(meta.total).to.eql(1);
        pm.expect(meta.counts.all).to.eql(1);
      });
