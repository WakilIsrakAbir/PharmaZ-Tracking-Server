$kind: http-request
method: PUT
url: '{{baseUrl}}/doctors/{{doctorId}}/assignees'
order: 3700
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "assignees": [{ "email": "{{otherUserEmail}}" }]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const doctor = pm.response.json().data || {};
      pm.test('only the second marketer stays assigned', () => {
        pm.expect(doctor.assignedTo.map((person) => person.email)).to.eql([pm.collectionVariables.get('otherUserEmail')]);
      });
      pm.test('the history gets no line for it either', () => {
        const notes = (doctor.history || []).map((entry) => entry.note);
        pm.expect(notes.some((note) => /^No longer assigned: /.test(note))).to.eql(false);
      });
