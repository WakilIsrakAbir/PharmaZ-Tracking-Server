$kind: http-request
method: POST
url: '{{baseUrl}}/pharmacies'
order: 3800
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Yesterday Visit Pharmacy",
      "status": "implementation",
      "visitDate": "{{pastVisitDate}}"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // Yesterday at 05:00 UTC: an admin enters a visit that already took place.
      const day = new Date();
      day.setUTCDate(day.getUTCDate() - 1);
      day.setUTCHours(5, 0, 0, 0);
      pm.collectionVariables.set('pastVisitDate', day.toISOString());
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('201 Created', () => pm.response.to.have.status(201));
      const pharmacy = pm.response.json().data || {};
      if (pharmacy.id) pm.collectionVariables.set('pastPharmacyId', pharmacy.id);
