$kind: http-request
method: POST
url: '{{baseUrl}}/pharmacies/{{fixPharmacyId}}/history/restore'
order: 3500
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "removal": "{{fixRemoval}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('404 Not Found', () => pm.response.to.have.status(404));
      pm.test('NOT_FOUND', () => pm.expect(pm.response.json().error.code).to.eql('NOT_FOUND'));
