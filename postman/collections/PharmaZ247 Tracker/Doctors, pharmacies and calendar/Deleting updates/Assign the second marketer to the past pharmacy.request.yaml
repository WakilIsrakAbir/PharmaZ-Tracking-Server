$kind: http-request
method: PUT
url: '{{baseUrl}}/pharmacies/{{pastOnlyPharmacyId}}/assignees'
order: 4100
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "assignees": [{ "email": "{{otherUserEmail}}" }]
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
