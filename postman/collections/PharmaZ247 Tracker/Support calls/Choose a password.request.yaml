$kind: http-request
method: PATCH
url: '{{baseUrl}}/auth/password'
order: 4500
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "{{supportUserTempPassword}}",
      "newPassword": "{{supportUserPassword}}"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.collectionVariables.set('supportUserPassword', 'Support-Call-2026');
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('no longer asks for a new password', () => {
        pm.expect((pm.response.json().data || {}).mustChangePassword).to.eql(false);
      });
