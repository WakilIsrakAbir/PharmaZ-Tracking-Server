$kind: http-request
method: POST
url: '{{baseUrl}}/support-calls'
order: 5700
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "callerType": "doctor",
      "callerName": "Dr. Time Traveller",
      "phone": "01711-000000",
      "problemTitle": "Called from tomorrow",
      "calledAt": "{{futureCall}}"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      pm.collectionVariables.set('futureCall', new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString());
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 Bad Request', () => pm.response.to.have.status(400));
      const error = pm.response.json().error || {};
      pm.test("a call can't come in later than now", () => {
        pm.expect(error.code).to.eql('VALIDATION_ERROR');
        pm.expect(error.fields && error.fields.calledAt).to.be.a('string');
      });
