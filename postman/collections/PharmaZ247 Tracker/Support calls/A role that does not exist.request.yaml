$kind: http-request
method: POST
url: '{{baseUrl}}/users'
order: 2500
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Nobody Special",
      "email": "nobody.{{$timestamp}}@example.com",
      "phone": "01611-000000",
      "role": "manager"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 Bad Request', () => pm.response.to.have.status(400));
      const error = pm.response.json().error || {};
      pm.test('only admin, marketing and support are roles', () => {
        pm.expect(error.code).to.eql('VALIDATION_ERROR');
        pm.expect(error.fields && error.fields.role).to.eql('Role must be admin, marketing or support.');
      });
