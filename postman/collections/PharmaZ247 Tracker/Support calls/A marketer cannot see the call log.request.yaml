$kind: http-request
method: GET
url: '{{baseUrl}}/support-calls'
order: 9700
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('403 Forbidden', () => pm.response.to.have.status(403));
      pm.test('the call log is closed to the marketing team', () => {
        pm.expect((pm.response.json().error || {}).code).to.eql('FORBIDDEN');
      });
