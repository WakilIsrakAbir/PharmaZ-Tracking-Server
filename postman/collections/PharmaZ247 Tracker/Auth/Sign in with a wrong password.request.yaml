$kind: http-request
method: POST
url: '{{baseUrl}}/auth/login'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "nobody.{{$timestamp}}@example.com",
      "password": "Wrong-Password-123"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // A random unknown email, so the sign-in limit for real accounts is never touched.
      pm.test('401 for a wrong email or password', () => pm.response.to.have.status(401));
      pm.test('INVALID_CREDENTIALS, without saying which part was wrong', () => {
        const { error } = pm.response.json();
        pm.expect(error.code).to.eql('INVALID_CREDENTIALS');
        pm.expect(error.message).to.be.a('string').and.not.be.empty;
        pm.expect(error).to.not.have.property('fields');
      });
      pm.test('no session cookie is set', () => {
        pm.expect(pm.response.headers.get('Set-Cookie') || '').to.not.match(/pz_session=[^;]/);
      });
