$kind: http-request
method: POST
url: '{{baseUrl}}/auth/login'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{newUserEmail}}",
      "password": "{{newUserTempPassword}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // The email is sent in mixed case on purpose: sign-in must ignore case.
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const data = pm.response.json().data || {};
      pm.test('signed in as the new teammate', () => {
        pm.expect(data.id).to.eql(pm.collectionVariables.get('newUserId'));
        pm.expect(data.role).to.eql('marketing');
      });
      pm.test('asks them to choose their own password', () => pm.expect(data.mustChangePassword).to.eql(true));
      pm.test('sets the session cookie', () => pm.expect(pm.cookies.has('pz_session')).to.be.true);
