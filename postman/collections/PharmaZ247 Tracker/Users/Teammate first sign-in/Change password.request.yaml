$kind: http-request
method: PATCH
url: '{{baseUrl}}/auth/password'
order: 5000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "{{newUserTempPassword}}",
      "newPassword": "{{newUserPassword}}"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // Any password is allowed: a short, numbers-only one works too.
      pm.collectionVariables.set('newUserPassword', '1234');
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 OK, even for a short password with no letters', () => pm.response.to.have.status(200));
      const data = pm.response.json().data || {};
      pm.test('no longer asks for a new password', () => {
        pm.expect(data.id).to.eql(pm.collectionVariables.get('newUserId'));
        pm.expect(data.mustChangePassword).to.eql(false);
      });
      pm.test('starts a fresh session cookie', () => {
        pm.expect(pm.response.headers.get('Set-Cookie') || '').to.include('pz_session=');
        pm.expect(pm.cookies.has('pz_session')).to.be.true;
      });
