$kind: http-request
method: PATCH
url: '{{baseUrl}}/auth/password'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "{{newUserTempPassword}}",
      "newPassword": ""
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Any password is allowed, but it can't be empty.
      pm.test('400 for an empty new password', () => pm.response.to.have.status(400));
      pm.test('asks for a password', () => {
        const { error } = pm.response.json();
        pm.expect(error.code).to.eql('VALIDATION_ERROR');
        pm.expect(error.fields).to.have.property('newPassword', 'Please enter a password.');
      });
