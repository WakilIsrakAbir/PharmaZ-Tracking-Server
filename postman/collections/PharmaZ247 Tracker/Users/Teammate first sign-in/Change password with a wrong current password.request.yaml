$kind: http-request
method: PATCH
url: '{{baseUrl}}/auth/password'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "currentPassword": "Not-My-Password-1",
      "newPassword": "Field-Team-2026"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 when the current password is wrong', () => pm.response.to.have.status(400));
      pm.test('VALIDATION_ERROR points at currentPassword', () => {
        const { error } = pm.response.json();
        pm.expect(error.code).to.eql('VALIDATION_ERROR');
        pm.expect(error.fields).to.have.property('currentPassword').that.is.a('string').and.not.empty;
      });
