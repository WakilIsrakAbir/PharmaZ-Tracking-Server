$kind: http-request
method: POST
url: '{{baseUrl}}/auth/login'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "{{adminEmail}}",
      "password": "{{adminPassword}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('signed in as the same admin', () => {
        pm.expect((pm.response.json().data || {}).id).to.eql(pm.collectionVariables.get('adminId'));
      });
      pm.test('sets the session cookie', () => pm.expect(pm.cookies.has('pz_session')).to.be.true);
