$kind: http-request
method: POST
url: '{{baseUrl}}/users/:id/reset-password'
order: 2000
pathVariables:
  - key: id
    value: '{{newUserId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const data = pm.response.json().data || {};
      pm.test('returns a new one-time temporary password', () => {
        pm.expect(data.temporaryPassword).to.be.a('string').with.length.above(7);
        pm.expect(data.temporaryPassword).to.not.eql(pm.collectionVariables.get('newUserPassword'));
      });
      pm.test('asks the teammate to choose a password again', () => {
        pm.expect((data.user || {}).id).to.eql(pm.collectionVariables.get('newUserId'));
        pm.expect((data.user || {}).mustChangePassword).to.eql(true);
      });
      if (data.temporaryPassword) pm.collectionVariables.set('newUserResetPassword', data.temporaryPassword);
