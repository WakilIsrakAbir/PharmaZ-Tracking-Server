$kind: http-request
method: POST
url: '{{baseUrl}}/users'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "QA Marketer",
      "email": "{{newUserEmail}}",
      "phone": "01711234567",
      "role": "marketing"
    }
scripts:
  - type: beforeRequest
    language: text/javascript
    code: |-
      // A fresh email for every run. The mixed case checks that it is stored in lower case.
      pm.collectionVariables.set('newUserEmail', `QA.${Date.now()}@Example.com`);
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('201 Created', () => pm.response.to.have.status(201));
      const data = pm.response.json().data || {};
      const user = data.user || {};
      pm.test('returns the user and a one-time temporary password', () => {
        pm.expect(user.id).to.match(/^[a-f0-9]{24}$/);
        pm.expect(data.temporaryPassword).to.be.a('string').with.length.above(7);
      });
      pm.test('stores the email in lower case', () => {
        pm.expect(user.email).to.eql(pm.collectionVariables.get('newUserEmail').toLowerCase());
      });
      pm.test('stores the phone in E.164', () => pm.expect(user.phone).to.eql('+8801711234567'));
      pm.test('is an active marketer who must choose a password', () => {
        pm.expect(user.role).to.eql('marketing');
        pm.expect(user.isActive).to.eql(true);
        pm.expect(user.mustChangePassword).to.eql(true);
      });
      pm.test('records which admin created the account', () => {
        pm.expect(user.createdBy).to.be.an('object');
        pm.expect(user.createdBy.id).to.eql(pm.collectionVariables.get('adminId'));
      });
      if (user.id) {
        pm.collectionVariables.set('newUserId', user.id);
        pm.collectionVariables.set('newUserTempPassword', data.temporaryPassword);
      }
