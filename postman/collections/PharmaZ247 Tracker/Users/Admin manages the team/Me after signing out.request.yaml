$kind: http-request
method: GET
url: '{{baseUrl}}/auth/me'
order: 8000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('401 once signed out', () => pm.response.to.have.status(401));
      pm.test('UNAUTHORIZED', () => pm.expect(pm.response.json().error.code).to.eql('UNAUTHORIZED'));
