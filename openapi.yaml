        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Pharmacies]
      operationId: updatePharmacy
      summary: Save an edited pharmacy form
      description: The same rules as `PUT /doctors/{id}`.
      requestBody:
        $ref: '#/components/requestBodies/PharmacyForm'
      responses:
        '200':
          description: The saved form.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PharmacyResponse'
              examples:
                saved:
                  $ref: '#/components/examples/PharmacyRahman'
        '400':
          $ref: '#/components/responses/FormError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
