      summary: Delete a pharmacy form
      description: Admin only. A deleted form can't be brought back.
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /pharmacies/{id}/status:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    patch:
      tags: [Pharmacies]
      operationId: changePharmacyStatus
      summary: Update the status (and the implementation steps)
      description: The same rules as `PATCH /doctors/{id}/status`.
      requestBody:
        $ref: '#/components/requestBodies/StatusChange'
      responses:
        '200':
          description: The pharmacy, with the new history entry last.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PharmacyResponse'
              examples:
                pharmacy:
                  $ref: '#/components/examples/PharmacyRahman'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /pharmacies/{id}/assignees:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    put:
      tags: [Pharmacys]
      operationId: assignPharmacy
      summary: Set who is assigned (admin)
      description: |
        The "Assign" button in the details panel. Replaces the list of assigned people with
        `assignees`. A teammate's address (an active account) links the pharmacy to them: they see it
        and can update it, like the person who submitted it. Any other address is kept as an outside
        assignee who only gets the emails, under the `name` given. When the list changes, `history`
        gets an entry such as "Assigned to Rafi Hasan, Partner Co" or "No longer assigned: Sumi Akter".

        Each newly assigned person is emailed the whole form, when the API has SMTP settings.
        `meta.email` says whether that worked; the assignment is saved either way.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssigneesRequest'
            example:
              assignees:
                - { email: sumi@pharmaz247.com }
                - { email: partner@example.com, name: Partner Co }
      responses:
        '200':
          description: The pharmacy, with the new assignees and history entry.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PharmacyResponse'
                  - type: object
                    required: [meta]
                    properties:
                      meta:
                        type: object
                        required: [email]
                        properties:
                          email:
                            $ref: '#/components/schemas/EmailReport'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /calendar:
    get:
      tags: [Calendar]
      operationId: getCalendar
      summary: List the visits in a date range
      description: |
        Doctors and pharmacies whose `visitDate` is on or after `from` and before `to`, soonest
        first. The web app asks for the weeks it is showing, for example a whole month grid.
        Marketing users get the visits they submitted or were assigned to; admins get the whole
        team's. `createdBy` says whose visit it is and `assignedTo` who else is on it.

        `place` is the line the calendar shows under the name: the doctor's chamber name (or the
        address when there is none), or the pharmacy's name.
      parameters:
        - name: from
          in: query
          required: true
          description: Start of the range (included).
          schema:
            $ref: '#/components/schemas/DateTime'
          example: '2026-09-26T18:00:00.000Z'
        - name: to
          in: query
          required: true
          description: End of the range (not included). Must be after `from`, and at most 62 days later.
          schema:
            $ref: '#/components/schemas/DateTime'
          example: '2026-11-06T18:00:00.000Z'
      responses:
        '200':
          description: The visits in the range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarResponse'
              examples:
                tomorrow:
                  $ref: '#/components/examples/CalendarTomorrow'
        '400':
          description: '`from` or `to` is missing or not a date, `to` is not after `from`, or the range is longer than 62 days.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingTo:
                  summary: No end date
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Please check the highlighted fields.
                      fields:
                        to: Please give an end date.
                tooLong:
                  summary: More than 62 days
                  value:
                    error:
                      code: VALIDATION_ERROR
                      message: Please check the highlighted fields.
                      fields:
                        to: Ask for 62 days or less at a time.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /calendar/months:
    get:
      tags: [Calendar]
      operationId: listMonthCounts
      summary: How many visits each month of a year has
      description: |
        For the year overview on the dashboard: one entry per month, January to December, with the
        number of doctor and pharmacy visits whose `visitDate` falls in that month (Asia/Dhaka), and
        the total. Months with nothing are included with zeros. Marketing users see only their own
        and assigned visits counted; admins the whole team's.
      parameters:
        - name: year
          in: query
          required: false
          description: The year, 2000–2100. Defaults to the current year in Dhaka.
          schema:
            type: integer
            minimum: 2000
            maximum: 2100
          example: 2026
      responses:
        '200':
          description: Twelve entries, January first.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    minItems: 12
                    maxItems: 12
                    items:
                      $ref: '#/components/schemas/MonthCount'
              example:
                data:
                  - { month: '2026-01', doctors: 0, pharmacies: 0, total: 0 }
                  - { month: '2026-02', doctors: 2, pharmacies: 1, total: 3 }
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /support-calls:
    get:
      tags: [Support calls]
      operationId: listSupportCalls
      summary: List support calls
      description: |
        One page of the call log, latest call first unless `sort` says otherwise. A support person
        gets only the calls they logged; an admin gets every call, with who logged it.

        The filters can be combined: `search` (the caller's name, the problem title, the phone
        number's digits), `status`, `type` (doctor or pharmacy), `createdBy` (who logged it), and
        `from` / `to` (the day the call came in, in Dhaka, both included). `meta.counts` says how
        many calls are open and resolved, for the tabs above the list; it follows every filter but
        `status`. `meta.total` is the number of calls on all the pages: the open tab's count.
      parameters:
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/CallStatusFilter'
        - $ref: '#/components/parameters/CallerTypeFilter'
        - $ref: '#/components/parameters/CreatedByFilter'
        - $ref: '#/components/parameters/CalledFrom'
        - $ref: '#/components/parameters/CalledTo'
        - $ref: '#/components/parameters/CallSort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of the matching calls.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportCallListResponse'
              examples:
                log:
                  $ref: '#/components/examples/SupportCallList'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [Support calls]
      operationId: createSupportCall
      summary: Log a support call
      description: |
        A support person (or an admin) logs a call. The person who sends it becomes `createdBy`
        (their name and phone number come from their account). `calledAt` is now unless the form
        says otherwise, and can't be in the future. `status` starts as `open` unless the form says
        otherwise; a call logged as `resolved` gets `resolvedAt` straight away.
      requestBody:
        $ref: '#/components/requestBodies/SupportCallForm'
      responses:
        '201':
          description: The call was logged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportCallResponse'
              examples:
                logged:
                  $ref: '#/components/examples/SupportCallOpen'
        '400':
          $ref: '#/components/responses/FormError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'

  /support-calls/{id}:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    get:
      tags: [Support calls]
      operationId: getSupportCall
      summary: Get one support call
      description: For a support person, someone else's call answers `404`, exactly as if it didn't exist. An admin can open any call.
      responses:
        '200':
          description: The call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportCallResponse'
              examples:
                call:
                  $ref: '#/components/examples/SupportCallOpen'
        '400':
          $ref: '#/components/responses/BadId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags: [Support calls]
      operationId: updateSupportCall
      summary: Save an edited support call
      description: |
        The whole form again. Leaving `calledAt` out keeps the saved moment. Setting `status` to
        `resolved` records when (`resolvedAt`); back to `open` clears it. The same rules on who may
        edit as `GET /support-calls/{id}`.
      requestBody:
        $ref: '#/components/requestBodies/SupportCallForm'
      responses:
        '200':
          description: The saved call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportCallResponse'
              examples:
                saved:
                  $ref: '#/components/examples/SupportCallResolved'
        '400':
          $ref: '#/components/responses/FormError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Support calls]
      operationId: deleteSupportCall
      summary: Delete a support call
      description: A support person may delete the calls they logged; an admin any call. A deleted call can't be brought back.
      responses:
        '204':
          description: Deleted.
        '400':
          $ref: '#/components/responses/BadId'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /support-calls/{id}/status:
    parameters:
      - $ref: '#/components/parameters/RecordId'
    patch:
      tags: [Support calls]
      operationId: changeSupportCallStatus
      summary: Mark a call resolved, or reopen it
      description: '"Mark as resolved" and "Reopen" in the web app. Resolving records `resolvedAt`; reopening clears it.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CallStatusChangeRequest'
            example:
              status: resolved
      responses:
        '200':
          description: The call, with its new status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupportCallResponse'
              examples:
                resolved:
                  $ref: '#/components/examples/SupportCallResolved'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: pz_session
      description: |
        The session cookie set by `POST /auth/login`. It is httpOnly (JavaScript can't read it),
        `SameSite=Lax`, `Secure` in production, and valid for 7 days. Changing or resetting a password,
        or deactivating the account, ends existing sessions.

  headers:
    SetSessionCookie:
      description: Sets or replaces the `pz_session` cookie.
      schema:
        type: string
      example: 'pz_session=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI2NzE3YTNmOWMyYjFlNDVkOGEwZjFhMDIifQ.sig; Max-Age=604800; Path=/; HttpOnly; SameSite=Lax'
    ClearSessionCookie:
      description: Clears the `pz_session` cookie.
      schema:
        type: string
      example: 'pz_session=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT; HttpOnly; SameSite=Lax'

  parameters:
    UserId:
      name: id
      in: path
      required: true
      description: The user's id.
      schema:
        $ref: '#/components/schemas/ObjectId'
      example: '6717a3f9c2b1e45d8a0f1a02'
    RecordId:
      name: id
      in: path
      required: true
      description: The record's id. A malformed id gets `400`; an id that doesn't exist gets `404`.
      schema:
        $ref: '#/components/schemas/ObjectId'
      example: '6717b2e4c2b1e45d8a0f2b10'
    Search:
      name: search
      in: query
      description: Matches the name, the phone number's digits and a few other text fields (such as the BMDC no., the area, or a teammate's email address). Case doesn't matter.
      schema:
        type: string
        maxLength: 80
      example: Tanvir
    StatusFilter:
      name: status
      in: query
      description: Only records in this status.
      schema:
        $ref: '#/components/schemas/OnboardingStatus'
    AssigneeFilter:
      name: assignee
      in: query
      description: Only records assigned to this teammate (their user id), or `none` for the records nobody is assigned to.
      schema:
        oneOf:
          - $ref: '#/components/schemas/ObjectId'
          - type: string
            const: none
      example: none
    CreatedByFilter:
      name: createdBy
      in: query
      description: Only records submitted by this teammate (their user id).
      schema:
        $ref: '#/components/schemas/ObjectId'
    VisitFrom:
      name: from
      in: query
      description: Only visits on this day (in Dhaka) or later.
      schema:
        $ref: '#/components/schemas/Day'
      example: '2026-10-01'
    VisitTo:
      name: to
      in: query
      description: Only visits on this day (in Dhaka) or earlier.
      schema:
        $ref: '#/components/schemas/Day'
      example: '2026-10-31'
    RecordSort:
      name: sort
      in: query
      description: 'The order of the list: `visit_desc` (latest visit first, the default), `visit_asc`, `name` (A to Z, whatever the case) or `updated` (last changed first).'
      schema:
        type: string
        enum: [visit_desc, visit_asc, name, updated]
        default: visit_desc
    RoleFilter:
      name: role
      in: query
      description: Only people with this role.
      schema:
        $ref: '#/components/schemas/Role'
    ActiveFilter:
      name: active
      in: query
      description: '`true` for the people who can sign in, `false` for the deactivated ones. Both when left out.'
      schema:
        type: boolean
    UserSort:
      name: sort
      in: query
      description: 'The order of the list: `name` (A to Z, the default), `last_login` (the most recent sign-in first, people who never signed in last) or `newest` (the latest account first).'
      schema:
        type: string
        enum: [name, last_login, newest]
        default: name
    Page:
      name: page
      in: query
      description: Which page, starting at 1.
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 2
    Limit:
      name: limit
      in: query
      description: How many per page, at most 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

    CallStatusFilter:
      name: status
      in: query
      description: Only calls in this status.
      schema:
        $ref: '#/components/schemas/CallStatus'
    CallerTypeFilter:
      name: type
      in: query
      description: Only calls from doctors, or only from pharmacies.
      schema:
        $ref: '#/components/schemas/CallerType'
    CalledFrom:
      name: from
      in: query
      description: Only calls that came in on this day (in Dhaka) or later.
      schema:
        $ref: '#/components/schemas/Day'
    CalledTo:
      name: to
      in: query
      description: Only calls that came in on this day (in Dhaka) or earlier.
      schema:
        $ref: '#/components/schemas/Day'
    CallSort:
      name: sort
      in: query
      description: 'The order of the log: `called_desc` (the latest call first, the default), `called_asc`, `name` (the caller, A to Z, whatever the case) or `updated` (last changed first).'
      schema:
        type: string
        enum: [called_desc, called_asc, name, updated]
        default: called_desc

  requestBodies:
    SupportCallForm:
      required: true
      description: The call, as JSON.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SupportCallForm'
          examples:
            call:
              $ref: '#/components/examples/SupportCallFormExample'
    DoctorForm:
      required: true
      description: The doctor form, as JSON.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DoctorForm'
          examples:
            sampleForm:
              $ref: '#/components/examples/DoctorTanvirForm'
    PharmacyForm:
      required: true
      description: The pharmacy form, as JSON.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PharmacyForm'
          examples:
            sampleForm:
              $ref: '#/components/examples/PharmacyRahmanForm'
    StatusChange:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StatusChangeRequest'
          examples:
            statusOnly:
              summary: A new status and a note
              value:
                status: setup
                note: Profile and slots set up
            withSteps:
              summary: Implementation, with the first of two steps done
              value:
                status: implementation
                visitDate: '2026-10-28T11:00:00.000Z'
                note: Training done
                implementationSteps:
                  - id: '6717d0c4c2b1e45d8a0f4e01'
                    title: Profile live in the app
                    done: true
                  - title: Train the chamber assistant
                    done: false

  responses:
    ValidationError:
      description: The request didn't pass validation. `fields` says what to fix, in words the web app can show.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            fields:
              summary: Problems with specific fields
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Please check the highlighted fields.
                  fields:
                    phone: Phone number should look like +880 1711-234567.
                    status: Status must be Demo, Ongoing, Setup, Implementation or Support.
            invalidJson:
              summary: The body is not valid JSON
              value:
                error:
                  code: INVALID_JSON
                  message: "The request body isn't valid JSON."
    FormError:
      description: The form didn't pass validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missingFields:
              summary: Required fields left empty
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Please check the highlighted fields.
                  fields:
                    name: Please enter the name.
                    phone: Please enter a phone number.
                    address: Please enter the address.
                    visitDate: Please pick the visit date.
            badValues:
              summary: Values in the wrong form
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Please check the highlighted fields.
                  fields:
                    email: Please enter a valid email address.
                    fees.firstVisit: Enter the fee as a whole number of taka.
    BadId:
      description: The id in the URL is not a valid id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: VALIDATION_ERROR
              message: Please check the highlighted fields.
              fields:
                id: That ID is not valid.
    Unauthorized:
      description: Not signed in, or the session expired or was ended (for example after a password reset).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            signedOut:
              summary: No session cookie
              value:
                error:
                  code: UNAUTHORIZED
                  message: Please sign in to continue.
            expired:
              summary: The session expired or was ended
              value:
                error:
                  code: UNAUTHORIZED
                  message: Your session has expired. Please sign in again.
    Forbidden:
      description: Signed in, but this role isn't allowed to do this.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: FORBIDDEN
              message: "You don't have permission to do that."
    NotFound:
      description: Nothing exists at this id, or it is a record this marketing user can't see.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: NOT_FOUND
              message: "We couldn't find that. It may have been deleted."
    TooManyRequests:
      description: Too many failed sign-in attempts for this email from this IP. Try again after the 15-minute window.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: TOO_MANY_REQUESTS
              message: Too many sign-in attempts. Please wait 15 minutes and try again.
    DatabaseUnavailable:
      description: The API is running but can't reach its database yet. `message` says why; try again once it is fixed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: DATABASE_UNAVAILABLE
              message: "MongoDB Atlas isn't accepting this computer's internet address (175.29.145.126). Add it in Atlas: Network Access → Add IP Address → Add Current IP Address. The API keeps trying and connects by itself."
    InternalError:
      description: Something broke on the server. The details are in the server log, never in the response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: INTERNAL_ERROR
              message: Something went wrong on our side. Please try again.

  schemas:
    # ---------- Building blocks ----------
    ObjectId:
      type: string
      pattern: '^[a-f0-9]{24}$'
      description: A database id.
      examples: ['6717a3f9c2b1e45d8a0f1a02']
    Day:
      type: string
      pattern: '^\d{4}-\d{2}-\d{2}$'
      description: A calendar day in Dhaka.
      examples: ['2026-10-27']
    DateTime:
      type: string
      format: date-time
      description: An ISO 8601 date and time in UTC.
      examples: ['2026-10-21T11:00:00.000Z']
    Phone:
      type: string
      pattern: '^\+8801[3-9]\d{8}$'
      description: A Bangladesh mobile number in E.164 form, as stored and returned by the API.
      examples: ['+8801711234567']
    PhoneInput:
      type: string
      minLength: 10
      maxLength: 20
      description: |
        A Bangladesh mobile number in any common format. Spaces, dashes and the country code are
        optional, so `01711234567`, `8801711234567` and `+880 1711-234567` are all accepted. It is
        stored as `+8801711234567`.
      examples: ['01711234567', '+880 1711-234567']
    Email:
      type: string
      format: email
      maxLength: 254
      description: Trimmed and stored in lower case.
      examples: ['rafi.hasan@example.com']
    OptionalEmail:
      type: string
      maxLength: 254
      description: An email address, or an empty string when there is none.
      anyOf:
        - format: email
        - maxLength: 0
      examples: ['tanvir.ahmed@squarehospital.com', '']
    Password:
      type: string
      format: password
      minLength: 1
      maxLength: 72
      description: Anything that isn't empty, up to 72 characters. There are no rules about length, letters or numbers.
      examples: ['Field-Team-2026', '1234']
    TemporaryPassword:
      type: string
      description: |
        Two words and four digits, so it is easy to read out or send in a message. It is shown only
        once. The teammate signs in with it and then chooses their own password.
      examples: ['Mango-4821-River']
    Role:
      type: string
      enum: [admin, marketing, support]
      description: |
        - `admin`: everything, including team accounts, deleting records, and every support call
        - `marketing`: fills in and updates doctor and pharmacy forms
        - `support`: logs support calls and sees only their own; nothing on the onboarding side
    OnboardingStatus:
      type: string
      enum: [demo, ongoing, setup, implementation, support]
      description: |
        Where a doctor or pharmacy is in onboarding. New records start as `demo` (the first visit) unless the form says otherwise.
        - `demo`: the first visit, showing PharmaZ247
        - `ongoing`: talks have started and the form is being filled in
        - `setup`: the form is complete; profile, slots and fees are being set up in PharmaZ247
        - `implementation`: going live, with training and the first bookings
        - `support`: live; the team now visits to support them
    Weekday:
      type: string
      enum: [sat, sun, mon, tue, wed, thu, fri]
      description: A day of the week. The week starts on Saturday.
    OptionalTime:
      type: string
      pattern: '^(([01]\d|2[0-3]):[0-5]\d)?$'
      description: A 24-hour Asia/Dhaka time (`HH:mm`), or an empty string when not given.
      examples: ['17:00', '']
    UserRef:
      type: object
      description: A short reference to a teammate.
      required: [id, name]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
      examples:
        - id: '6717a3f9c2b1e45d8a0f1a02'
          name: Rafi Hasan
    Submitter:
      type: object
      description: The person who submitted a form, so the team knows whom to ask about it.
      required: [id, name, phone]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
        phone:
          description: '`null` only for an older account that has no phone number yet.'
          anyOf:
            - $ref: '#/components/schemas/Phone'
            - type: 'null'
      examples:
        - id: '6717a3f9c2b1e45d8a0f1a02'
          name: Rafi Hasan
          phone: '+8801711234567'
    Assignee:
      type: object
      description: "Someone assigned to a form. A teammate has an account (`teammate: true`, with `id` and `phone`); an outside email address has none, and `name` is the one given when assigning (or the address itself)."
      required: [id, name, email, phone, teammate]
      properties:
        id:
          description: The teammate's user id, or `null` for an outside address.
          anyOf:
            - $ref: '#/components/schemas/ObjectId'
            - type: 'null'
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          anyOf:
            - $ref: '#/components/schemas/Phone'
            - type: 'null'
        teammate:
          type: boolean
      examples:
        - id: '6717a3f9c2b1e45d8a0f1a03'
          name: Sumi Akter
          email: sumi@pharmaz247.com
          phone: '+8801812345678'
          teammate: true
        - id: null
          name: partner@example.com
          email: partner@example.com
          phone: null
          teammate: false
    AssigneesRequest:
      type: object
      required: [assignees]
      properties:
        assignees:
          type: array
          description: The whole list of assigned people. A teammate's address links the form to their account (their `name` is ignored, the account's is used); any other address only gets the emails, under the `name` given. An empty list unassigns everyone.
          maxItems: 20
          items:
            type: object
            required: [email]
            properties:
              email:
                type: string
                format: email
              name:
                type: string
                maxLength: 80
                description: For an outside address. Optional; the address itself is shown when there is none.
    EmailReport:
      type: object
      description: What happened to the assignment emails.
      required: [configured, sent, failed]
      properties:
        configured:
          type: boolean
          description: '`false` when the API has no SMTP settings, so no email is ever sent.'
        sent:
          type: array
          description: Names of the newly assigned people who got the email.
          items:
            type: string
        failed:
          type: array
          description: The newly assigned people whose email could not be sent (they are still assigned), each with the reason in plain words. "Sent" only means the mail server took the email; the recipient's mail service decides later whether it reaches the inbox.
          items:
            type: object
            required: [name, reason]
            properties:
              name:
                type: string
              reason:
                type: string
                examples: ["the mail server refused the address (550 5.1.1 User unknown)"]
    StatusCounts:
      type: object
      description: How many records are in each status. Follows every filter but `status`, so every tab keeps its number while one is open.
      required: [all, demo, ongoing, setup, implementation, support]
      properties:
        all:
          type: integer
          minimum: 0
        demo:
          type: integer
          minimum: 0
        ongoing:
          type: integer
          minimum: 0
        setup:
          type: integer
          minimum: 0
        implementation:
          type: integer
          minimum: 0
        support:
          type: integer
          minimum: 0

    # ---------- Errors ----------
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - INVALID_JSON
        - BAD_REQUEST
        - SELF_CHANGE
        - UNAUTHORIZED
        - INVALID_CREDENTIALS
        - FORBIDDEN
        - ACCOUNT_INACTIVE
        - NOT_FOUND
        - EMAIL_TAKEN
        - DUPLICATE
        - TOO_MANY_REQUESTS
        - INTERNAL_ERROR
        - DATABASE_UNAVAILABLE
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: A sentence written for people. The web app shows it as it is.
            fields:
              type: object
              description: Field-level problems. Keys are dot paths into the request body or query (for example `fees.firstVisit`), and values are messages for people.
              additionalProperties:
                type: string

    # ---------- Users and auth ----------
    User:
      type: object
      required: [id, name, email, phone, role, isActive, mustChangePassword, lastLoginAt, createdBy, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        name:
          type: string
          minLength: 2
          maxLength: 80
        email:
          $ref: '#/components/schemas/Email'
        phone:
          anyOf:
            - $ref: '#/components/schemas/Phone'
            - type: 'null'
        role:
          $ref: '#/components/schemas/Role'
        isActive:
          type: boolean
          description: '`false` after an admin deactivates the account. Deactivated people cannot sign in.'
        mustChangePassword:
          type: boolean
          description: '`true` after an admin creates the account or resets its password, until the person chooses their own.'
        lastLoginAt:
          anyOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        createdBy:
          description: The admin who created the account. `null` for the first admin, who is created by the seed script.
          anyOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
    UserResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/User'
    PageMeta:
      type: object
      description: Where this page sits in the whole list.
      required: [page, limit, total, pages]
      properties:
        page:
          type: integer
          minimum: 1
          description: This page, starting at 1.
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: How many per page.
        total:
          type: integer
          minimum: 0
          description: How many match, over all the pages.
        pages:
          type: integer
          minimum: 0
          description: How many pages there are (0 when nothing matches).
    UserListMeta:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [counts]
          properties:
            counts:
              type: object
              description: How many people are active and deactivated. Follows `search` and `role` but ignores `active`, so both tabs keep their numbers.
              required: [active, deactivated]
              properties:
                active:
                  type: integer
                  minimum: 0
                deactivated:
                  type: integer
                  minimum: 0
    UserListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        meta:
          $ref: '#/components/schemas/UserListMeta'
    CreatedUserResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user, temporaryPassword]
          properties:
            user:
              $ref: '#/components/schemas/User'
            temporaryPassword:
              $ref: '#/components/schemas/TemporaryPassword'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          format: password
          minLength: 1
    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 1
          description: The password used to sign in (the temporary one at first sign-in).
        newPassword:
          $ref: '#/components/schemas/Password'
    CreateUserRequest:
      type: object
      required: [name, email, phone]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
          examples: ['Rafi Hasan']
        email:
          $ref: '#/components/schemas/Email'
        phone:
          $ref: '#/components/schemas/PhoneInput'
          description: Shown on every form this teammate submits.
        role:
          $ref: '#/components/schemas/Role'
          default: marketing
    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        phone:
          $ref: '#/components/schemas/PhoneInput'
          description: A new phone number. It can't be removed, only changed.
        role:
          $ref: '#/components/schemas/Role'
        isActive:
          type: boolean
          description: '`false` deactivates the account and signs the person out everywhere. `true` reactivates it.'

    # ---------- Doctor and pharmacy records ----------
    RecordType:
      type: string
      enum: [doctor, pharmacy]
    HistoryEntry:
      type: object
      description: One status or visit-date change.
      required: [status, visitDate, note, steps, by, at]
      properties:
        status:
          $ref: '#/components/schemas/OnboardingStatus'
        visitDate:
          $ref: '#/components/schemas/DateTime'
        note:
          type: string
          description: '"Form submitted" for the first entry, "Form updated" when an edit changed the status or visit date, "Assigned to …" / "No longer assigned: …" when the assigned teammates changed, or the note given with a status change (empty when none was given).'
        steps:
          description: How far the implementation steps were at that moment. Set by status updates to `implementation` when there are steps; otherwise `null`.
          anyOf:
            - $ref: '#/components/schemas/StepProgress'
            - type: 'null'
        by:
          description: Who made the change, or `null` when that isn't known.
          anyOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        at:
          $ref: '#/components/schemas/DateTime'
          description: When the change was made.
    StepProgress:
      type: object
      description: How many implementation steps are done, out of how many.
      required: [done, total]
      properties:
        done:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 1
      examples:
        - done: 1
          total: 2
    ImplementationStep:
      type: object
      description: One step of an implementation that takes several visits.
      required: [id, title, done, doneAt]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        title:
          type: string
          description: What the step is, in the marketer's words.
          examples: ['Train the chamber assistant']
        done:
          type: boolean
        doneAt:
          description: When the step was ticked off, or `null` while it is still to do.
          anyOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
    ImplementationStepInput:
      type: object
      description: A step as the status update sends it. Existing steps send their `id`; new steps leave it out.
      required: [title]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        title:
          type: string
          minLength: 2
          maxLength: 120
        done:
          type: boolean
          default: false
    RecordBase:
      type: object
      description: The fields every record has.
      required: [id, type, name, phone, email, address, visitDate, status, notes, implementationSteps, history, createdBy, assignedTo, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        type:
          $ref: '#/components/schemas/RecordType'
        name:
          type: string
          description: The doctor's full name (form field 1) or the pharmacy's name.
        phone:
          $ref: '#/components/schemas/Phone'
        email:
          $ref: '#/components/schemas/OptionalEmail'
        address:
          type: string
          description: The chamber address (form field 7) or the pharmacy's address.
        visitDate:
          $ref: '#/components/schemas/DateTime'
          description: When the marketer visits, or visited. This puts the record on the calendar.
        status:
          $ref: '#/components/schemas/OnboardingStatus'
        notes:
          type: string
          description: Anything else worth knowing. Empty when there is nothing.
        implementationSteps:
          type: array
          description: The implementation checklist, in order. Empty until someone adds a step.
          maxItems: 20
          items:
            $ref: '#/components/schemas/ImplementationStep'
        history:
          type: array
          description: Every status and visit-date change, oldest first. The first entry is "Form submitted".
          minItems: 1
          items:
            $ref: '#/components/schemas/HistoryEntry'
        createdBy:
          $ref: '#/components/schemas/Submitter'
          description: The marketing person who submitted the form, with their phone number. They, the assigned teammates and the admins can see the form.
        assignedTo:
          type: array
          description: "The people an admin assigned to this form (see `PUT /doctors/{id}/assignees`): teammates, who see and can update it, and outside email addresses, who only get the emails."
          maxItems: 20
          items:
            $ref: '#/components/schemas/Assignee'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
    ConsultationType:
      type: string
      enum: [in_person, teleconsultation]
    SlotDuration:
      type: [integer, 'null']
      enum: [10, 15, 20, 30, 45, 60, null]
      description: '(10) Slot Duration: minutes per appointment, or `null` when not given.'
    Fee:
      type: [integer, 'null']
      minimum: 0
      description: Whole taka (৳), or `null` when not given.
    FeesForm:
      type: object
      description: '(12–15) Fees. Leave a fee out (or send `null`) when it is not known yet.'
      properties:
        firstVisit:
          $ref: '#/components/schemas/Fee'
          description: (12) First Visit.
        reportView:
          $ref: '#/components/schemas/Fee'
          description: (13) Report View.
        secondVisit:
          $ref: '#/components/schemas/Fee'
          description: (14) 2nd Visit (within 1 month).
        afterOneMonth:
          $ref: '#/components/schemas/Fee'
          description: (15) After 1 month.
    Fees:
      allOf:
        - $ref: '#/components/schemas/FeesForm'
        - required: [firstVisit, reportView, secondVisit, afterOneMonth]
    DoctorFields:
      type: object
      description: The doctor-only fields. Numbers in brackets are the paper form's fields.
      properties:
        bmdcRegNo:
          type: string
          description: (3) BMDC Reg. No.
          examples: ['A-43921']
        chamberName:
          type: string
          description: (6) Chamber Name.
        chamberNo:
          type: string
          description: (9) Chamber No.
        consultationTypes:
          type: array
          description: '(8) Consultation Type: one or both.'
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ConsultationType'
        slotDuration:
          $ref: '#/components/schemas/SlotDuration'
        availableDays:
          type: array
          description: (11) Available days.
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Weekday'
        availableFrom:
          $ref: '#/components/schemas/OptionalTime'
          description: (11) Available from.
        availableTo:
          $ref: '#/components/schemas/OptionalTime'
          description: (11) Available until.
    Doctor:
      description: |
        A filled-in Doctor Onboarding Form. The paper form's fields map to: (1) `name`,
        (2) is the photo, which the tracker does not keep, (3) `bmdcRegNo`, (4) `phone`, (5) `email`, (6) `chamberName`, (7) `address`,
        (8) `consultationTypes`, (9) `chamberNo`, (10) `slotDuration`, (11) `availableDays`,
        `availableFrom` and `availableTo`, (12–15) `fees`.
      allOf:
        - $ref: '#/components/schemas/RecordBase'
        - $ref: '#/components/schemas/DoctorFields'
        - type: object
          required: [bmdcRegNo, chamberName, chamberNo, consultationTypes, slotDuration, availableDays, availableFrom, availableTo, fees]
          properties:
            type:
              const: doctor
            fees:
              $ref: '#/components/schemas/Fees'
    PaymentMethod:
      type: string
      enum: [cash, bkash, nagad, card]
    PharmacyFields:
      type: object
      description: The pharmacy-only fields (draft until the pharmacy paper form is confirmed).
      properties:
        ownerName:
          type: string
        drugLicenseNo:
          type: string
          description: DGDA drug licence no.
          examples: ['DL-12345']
        tradeLicenseNo:
          type: string
        area:
          type: string
          description: Thana or area, for example Dhanmondi.
        district:
          type: string
        availableDays:
          type: array
          description: Opening days.
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Weekday'
        availableFrom:
          $ref: '#/components/schemas/OptionalTime'
          description: Opens at.
        availableTo:
          $ref: '#/components/schemas/OptionalTime'
          description: Closes at.
        homeDelivery:
          type: [boolean, 'null']
          description: Does the pharmacy deliver? `null` when not known.
        paymentMethods:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/PaymentMethod'
    Pharmacy:
      description: A filled-in pharmacy onboarding form.
      allOf:
        - $ref: '#/components/schemas/RecordBase'
        - $ref: '#/components/schemas/PharmacyFields'
        - type: object
          required: [ownerName, drugLicenseNo, tradeLicenseNo, area, district, availableDays, availableFrom, availableTo, homeDelivery, paymentMethods]
          properties:
            type:
              const: pharmacy
    RecordFormBase:
      type: object
      description: |
        The fields every form sends. Only `name`, `phone`, `address` and `visitDate` are required.
        Anything left out is saved empty: `""` for text, `[]` for lists and `null` for numbers and
        yes/no answers.
      required: [name, phone, address, visitDate]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          $ref: '#/components/schemas/PhoneInput'
        email:
          $ref: '#/components/schemas/OptionalEmail'
        address:
          type: string
          minLength: 3
        visitDate:
          type: string
          format: date-time
          description: The visit date and time. ISO 8601 is best, for example `2026-10-21T11:00:00.000Z`.
        status:
          $ref: '#/components/schemas/OnboardingStatus'
          default: demo
        notes:
          type: string
    DoctorForm:
      description: A doctor form, as the web app sends it.
      allOf:
        - $ref: '#/components/schemas/RecordFormBase'
        - $ref: '#/components/schemas/DoctorFields'
        - type: object
          properties:
            fees:
              $ref: '#/components/schemas/FeesForm'
    PharmacyForm:
      description: A pharmacy form, as the web app sends it.
      allOf:
        - $ref: '#/components/schemas/RecordFormBase'
        - $ref: '#/components/schemas/PharmacyFields'
    StatusChangeRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/OnboardingStatus'
        visitDate:
          $ref: '#/components/schemas/DateTime'
          description: Optional. A new visit date. Without it, the current one stays.
        note:
          type: string
          maxLength: 500
          description: Optional. Saved on the history entry, for example what happened at the visit.
        implementationSteps:
          type: array
          description: Optional. The whole checklist, which replaces the current one. Leave it out to keep the current steps.
          maxItems: 20
          items:
            $ref: '#/components/schemas/ImplementationStepInput'
    RecordListMeta:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [counts]
          properties:
            counts:
              $ref: '#/components/schemas/StatusCounts'
    DoctorResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Doctor'
    DoctorListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Doctor'
        meta:
          $ref: '#/components/schemas/RecordListMeta'
    PharmacyResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Pharmacy'
    PharmacyListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Pharmacy'
        meta:
          $ref: '#/components/schemas/RecordListMeta'

    # ---------- Calendar ----------
    CalendarItem:
      type: object
      description: One visit on the calendar.
      required: [id, type, name, place, address, status, steps, visitDate, phone, createdBy, assignedTo]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        type:
          $ref: '#/components/schemas/RecordType'
        name:
          type: string
        place:
          type: string
          description: The doctor's chamber name (or the address when there is none), or the pharmacy's name.
        address:
          type: string
        status:
          $ref: '#/components/schemas/OnboardingStatus'
        steps:
          description: How many implementation steps are done, or `null` when the record has none.
          anyOf:
            - $ref: '#/components/schemas/StepProgress'
            - type: 'null'
        visitDate:
          $ref: '#/components/schemas/DateTime'
        phone:
          $ref: '#/components/schemas/Phone'
        createdBy:
          description: Whose visit it is (the person who submitted the form), or `null` when that isn't known.
          anyOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
        assignedTo:
          type: array
          description: The teammates assigned to this form.
          items:
            $ref: '#/components/schemas/UserRef'
    MonthCount:
      type: object
      description: The visits in one month.
      required: [month, doctors, pharmacies, total]
      properties:
        month:
          type: string
          pattern: '^\d{4}-\d{2}$'
          examples: ['2026-10']
        doctors:
          type: integer
          minimum: 0
        pharmacies:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
          description: doctors + pharmacies
    CalendarResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          description: Sorted by `visitDate`, soonest first.
          items:
            $ref: '#/components/schemas/CalendarItem'

    # ---------- Support calls ----------
    CallerType:
      type: string
      enum: [doctor, pharmacy]
      description: Who called.
    CallStatus:
      type: string
      enum: [open, resolved]
      description: '`open` until the problem is solved, then `resolved`.'
    SupportCall:
      type: object
      description: One call to the support team.
      required: [id, callerType, callerName, phone, problemTitle, description, status, resolvedAt, calledAt, createdBy, createdAt, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/ObjectId'
        callerType:
          $ref: '#/components/schemas/CallerType'
        callerName:
          type: string
        phone:
          $ref: '#/components/schemas/Phone'
        problemTitle:
          type: string
        description:
          type: string
        status:
          $ref: '#/components/schemas/CallStatus'
        resolvedAt:
          description: When the call became resolved; `null` while open.
          anyOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        calledAt:
          $ref: '#/components/schemas/DateTime'
          description: When the call came in.
        createdBy:
          description: The support person (or admin) who logged the call, with their phone number.
          anyOf:
            - $ref: '#/components/schemas/Submitter'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/DateTime'
        updatedAt:
          $ref: '#/components/schemas/DateTime'
    SupportCallForm:
      type: object
      description: 'A call, as the web app sends it. Required: who called, their name and phone, and the problem title.'
      required: [callerType, callerName, phone, problemTitle]
      properties:
        callerType:
          $ref: '#/components/schemas/CallerType'
        callerName:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          $ref: '#/components/schemas/PhoneInput'
        problemTitle:
          type: string
          minLength: 2
          maxLength: 120
        description:
          type: string
          maxLength: 2000
        status:
          $ref: '#/components/schemas/CallStatus'
          default: open
        calledAt:
          $ref: '#/components/schemas/DateTime'
          description: When the call came in. Now when left out; never in the future.
    CallStatusChangeRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/CallStatus'
    SupportCallResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SupportCall'
    SupportCallListMeta:
      allOf:
        - $ref: '#/components/schemas/PageMeta'
        - type: object
          required: [counts]
          properties:
            counts:
              type: object
              description: How many calls are open and resolved. Follows every filter but `status`, so both tabs keep their numbers.
              required: [all, open, resolved]
              properties:
                all:
                  type: integer
                  minimum: 0
                open:
                  type: integer
                  minimum: 0
                resolved:
                  type: integer
                  minimum: 0
    SupportCallListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SupportCall'
        meta:
          $ref: '#/components/schemas/SupportCallListMeta'

